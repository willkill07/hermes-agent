name: nemo_relay
version: "0.1.0"
description: "NeMo Relay runtime scopes, managed LLM/tool calls, and native observability exporters for Hermes."
author: NousResearch
hooks:
  - on_run_start
  - on_run_end
  - on_session_end
  - pre_llm_call
  - post_llm_call
  - api_request_error
  - pre_approval_request
  - post_approval_response
  - subagent_start
  - subagent_stop
